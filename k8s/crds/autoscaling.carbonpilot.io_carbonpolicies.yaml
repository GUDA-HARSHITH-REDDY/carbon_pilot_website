apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonpolicies.autoscaling.carbonpilot.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: autoscaling.carbonpilot.io
  names:
    kind: CarbonPolicy
    listKind: CarbonPolicyList
    plural: carbonpolicies
    singular: carbonpolicy
    shortNames:
      - cp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: CarbonPolicy defines the carbon-aware auto-scaling configuration and SLO guardrails for a microservice.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - targetRef
                - thresholds
                - sloGuardrails
              properties:
                targetRef:
                  type: object
                  description: Reference to the target Deployment or HorizontalPodAutoscaler.
                  required:
                    - apiVersion
                    - kind
                    - name
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                carbonSignal:
                  type: object
                  properties:
                    provider:
                      type: string
                      enum: [ElectricityMaps, WattTime, Synthetic]
                      default: ElectricityMaps
                    zone:
                      type: string
                      default: US-VA
                    cacheTtlSeconds:
                      type: integer
                      minimum: 15
                      default: 60
                thresholds:
                  type: object
                  required:
                    - baseCpuPercent
                    - maxAllowedCpuPercent
                  properties:
                    baseCpuPercent:
                      type: integer
                      minimum: 30
                      maximum: 80
                      default: 60
                    maxAllowedCpuPercent:
                      type: integer
                      minimum: 40
                      maximum: 95
                      default: 80
                    carbonWeightAlpha:
                      type: number
                      minimum: 0.0
                      maximum: 1.0
                      default: 0.75
                    cooldownSeconds:
                      type: integer
                      minimum: 10
                      default: 30
                sloGuardrails:
                  type: object
                  required:
                    - latencyCeilingMs
                    - safetyMarginMs
                  properties:
                    latencyCeilingMs:
                      type: integer
                      minimum: 50
                      default: 150
                    safetyMarginMs:
                      type: integer
                      minimum: 10
                      default: 25
                    metricQuery:
                      type: string
            status:
              type: object
              properties:
                lastEvaluatedIntensity:
                  type: number
                lastTunedCpuPercent:
                  type: integer
                currentReplicas:
                  type: integer
                guardrailActive:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Base CPU
          type: integer
          jsonPath: .spec.thresholds.baseCpuPercent
        - name: Tuned CPU
          type: integer
          jsonPath: .status.lastTunedCpuPercent
        - name: SLO Ceiling
          type: integer
          jsonPath: .spec.sloGuardrails.latencyCeilingMs
        - name: Guardrail
          type: boolean
          jsonPath: .status.guardrailActive
