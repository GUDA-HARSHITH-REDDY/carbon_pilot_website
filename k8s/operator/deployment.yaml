apiVersion: v1
kind: Namespace
metadata:
  name: carbon-pilot-system
  labels:
    app.kubernetes.io/name: carbon-pilot
    app.kubernetes.io/part-of: carbon-pilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbon-pilot-controller-manager
  namespace: carbon-pilot-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carbon-pilot-manager-role
rules:
  - apiGroups: ["autoscaling.carbonpilot.io"]
    resources: ["carbonpolicies", "carbonpolicies/status", "carbonpolicies/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carbon-pilot-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: carbon-pilot-manager-role
subjects:
  - kind: ServiceAccount
    name: carbon-pilot-controller-manager
    namespace: carbon-pilot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-pilot-operator
  namespace: carbon-pilot-system
  labels:
    app.kubernetes.io/name: carbon-pilot
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carbon-pilot
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbon-pilot
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: carbon-pilot-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: ghcr.io/guda-harshith-reddy/carbon-pilot-operator:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: OPERATING_MODE
              value: "kubernetes"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: carbon-pilot-service
  namespace: carbon-pilot-system
spec:
  selector:
    app.kubernetes.io/name: carbon-pilot
    app.kubernetes.io/component: operator
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
